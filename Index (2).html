<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beba: Trusted Hand-off Prototype</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2a22;--mut:#667068;--pri:#0f7a4a;--pri-ink:#fff;--line:#e2ddd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1c2520;--ink:#e9efe9;--mut:#9aa89e;--pri:#3ecf8e;--pri-ink:#07210f;--line:#2b372f;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:400px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{flex:1 1 auto;padding:10px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.phone{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;min-height:560px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:14px 0 6px}
p{color:var(--mut);font-size:13px;margin:4px 0}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--pri-ink);font-size:15px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:2px 4px 2px 0}
.ok{color:var(--pri);font-weight:600}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer}.seg button.on{border-color:var(--pri);color:var(--pri);font-weight:600}
.step{display:flex;gap:10px;padding:7px 0;font-size:14px;opacity:.45}.step.done,.step.now{opacity:1}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px}
.done .dot{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}.now .dot{border-color:var(--pri)}
.esc{background:var(--bg);border-radius:12px;padding:10px;font-size:13px;margin-top:10px}
.pin{font-size:34px;letter-spacing:10px;text-align:center;font-weight:700;margin:14px 0;color:var(--pri)}
.photo{height:64px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--mut);text-align:center;flex:1;padding:4px}
li{font-size:14px;margin:8px 0}
</style></head><body>
<div class="app">
<div class="tabs"><button id="tp" class="on" onclick="setRole('p')">Profile</button><button id="tb" onclick="setRole('b')">Sender</button><button id="tr" onclick="setRole('r')">Carrier</button><button id="tc" onclick="setRole('c')">Client link</button><button id="tt" onclick="setRole('t')">Trust</button></div>
<div class="phone" id="screen"></div>
</div>
<script>
var S=1,R='p',P={n:'Mama Njeri',ph:'0700 111 222',town:'Nairobi',send:true,biz:true,car:false,bn:'Mama Njeri Clothes',mk:'Gikomba',gd:'Second-hand clothes',till:'',note:'',pin:null,pv:''},D={prog:0,pins:{from:null,to:null},pn:{from:'',to:''},pw:'from',byBiz:true,mode:'stage',from:'Gikomba, Stall 14',item:'3 sacks of second-hand clothes (Esther’s order)',to:'Thika stage, Accra Rd',rcv:'Esther · 0712 345 678'};
var CR={stage:[{n:'Kevin M.',s:'Kevin',r:'4.9',j:212,f:'400',l:'50,000',z:1},{n:'Faith W.',s:'Faith',r:'4.6',j:38,f:'300',l:'20,000',z:0}],town:[{n:'Kevin M.',s:'Kevin',r:'4.9',j:212,f:'250',l:'50,000',z:1},{n:'Faith W.',s:'Faith',r:'4.6',j:38,f:'200',l:'20,000',z:0}],far:[{n:'Joseph K.',s:'Joseph',r:'4.9',j:212,f:'1,200',l:'50,000',z:1},{n:'Mercy A.',s:'Mercy',r:'4.6',j:38,f:'900',l:'20,000',z:0}]};D.c=CR.stage[0];
function $(i){return document.getElementById(i)}
function pick(i){D.c=CR[D.mode][i];go(3)}
var SS={};
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function newReq(b){D.byBiz=b;SS.b=1;D.prog=0;if(R=='b'){S=1;render()}else setRole('b')}
function setRole(r){SS[R]=S;R=r;S=SS[r]||1;if(r=='b'&&!P.biz)D.byBiz=false;['p','b','r','c','t'].forEach(function(x){$('t'+x).className=x==r?'on':''});render()}
function go(n){S=n;if(R=='b')D.prog={1:0,2:0,3:0,4:1,5:4,6:5}[n];render()}
function save(){D.from=$('f').value;D.item=$('i').value;D.to=$('t').value;D.rcv=$('c').value}
function mode(m){save();D.mode=m;D.c=CR[m][0];D.pins.to=null;D.pn.to='';D.to={town:'Hilton House',stage:'Thika stage, Accra Rd',far:'Kitale town, Kitale stage'}[m];render()}
function steps(n){var l=D.mode=='town'?['Carrier accepted','Picked up (PIN and photo)','On the way','Arrived at drop-off','Receiver collected, code confirmed']:['Carrier accepted','Picked up (PIN and photo)','At the stage','Loaded on matatu (parcel slip)','Receiver collected, code confirmed'];
return l.map(function(t,i){var c=i<n?'done':i==n?'now':'';return '<div class="step '+c+'"><div class="dot">'+(i<n?'✓':'')+'</div>'+t+'</div>'}).join('')}
function reqNext(){save();if(!D.pins.from){$('msg').textContent='Pin the pickup point on the map.';return}if(D.mode!='far'&&!D.pins.to){$('msg').textContent=D.mode=='town'?'Pin the drop-off point on the map.':'Pin the drop-off stage on the map.';return}go(2)}
function acceptGo(){if(!$('own').checked){$('msg').textContent='Please accept the terms to continue.';return}go(4)}
function render(){var h='';
if(R=='p'){h=prof()}
else if(R=='c'){h=client()}
else if(R=='t'){h='<h1>How trust is built in</h1><p>The carrier holds goods, so the carrier carries the risk.</p><ol style="padding-left:18px"><li><b>Verified carriers.</b> ID, selfie match, M-Pesa number, one referee.</li><li><b>Value tiers.</b> New carriers handle goods up to KES 5,000. Limits rise with completed, rated jobs.</li><li><b>Guarantor.</b> A stage chairman, sacco official or market leader vouches for each carrier.</li><li><b>Pilot cap.</b> Goods up to KES 5,000 per job while the app is in testing.</li><li><b>Direct payment.</b> The sender pays the carrier by M-Pesa. Beba holds no money.</li><li><b>Own-risk terms.</b> Senders accept that they use the service at their own risk. Beba is free during the pilot.</li><li><b>Pickup PIN and photo.</b> Proves the hand-over from sender to carrier.</li><li><b>Matatu proof.</b> Photo of the sacco parcel slip with plate number and conductor phone.</li><li><b>Receiver code.</b> The fee releases only when the receiver confirms.</li><li><b>Disputes.</b> 24-hour window. Photos, slip and GPS trail decide.</li></ol>'}
else if(R=='b'){
if(S==1)h='<h1>'+(D.byBiz?'Get a carrier for your client':'Find a delivery person')+'</h1><p>'+(D.byBiz?'Your client gets an SMS tracking link. No app needed.':'Already bought? Get them across town, to a stage or to a far town with someone you can trust.')+'</p><div class="seg"><button class="'+(D.mode=='town'?'on':'')+'" onclick="mode(\'town\')">Within town</button><button class="'+(D.mode=='stage'?'on':'')+'" onclick="mode(\'stage\')">To a stage</button><button class="'+(D.mode=='far'?'on':'')+'" onclick="mode(\'far\')">To a far town</button></div><label>Pickup point</label><input id="f" value="'+esc(D.from)+'">'+sPinRow('from')+'<label>Goods</label><textarea id="i" rows="2">'+esc(D.item)+'</textarea><label>'+({town:'Drop-off point',stage:'Drop-off stage',far:'Destination'}[D.mode])+'</label><input id="t" value="'+esc(D.to)+'">'+(D.mode!='far'?sPinRow('to'):'<p style="font-size:12px">The live app lets you search any town on Google Maps.</p>')+'<label>'+(D.byBiz?'Client name and phone':'Receiver name and phone')+'</label><input id="c" value="'+esc(D.rcv)+'"><p id="msg" style="color:#b45309;font-weight:600"></p><button class="btn" onclick="reqNext()">Find trusted carriers</button>';
if(S==2){var far=D.mode=='far';h='<h1>'+(far?'Carriers near Kitale':(D.pins.from&&D.pins.from.label.indexOf('near')==0?'Carriers '+esc(D.pins.from.label):'Carriers near you'))+'</h1><p>'+(far?'Local agents and travellers heading that way.':'Ranked by trust score.')+'</p>'+CR[D.mode].map(function(c,i){return '<div class="card"><b>'+c.n+'</b> <span class="ok">'+c.r+' ★</span><br><span class="badge">ID verified</span><span class="badge">'+c.j+' jobs</span>'+(c.z?'<span class="badge">Zero losses</span>':'')+'<span class="badge">Limit KES '+c.l+'</span><p>Fee KES '+c.f+(i==0?' · paid directly to carrier':'')+'</p><button class="btn'+(i?' alt':'')+'" onclick="pick('+i+')">Choose '+c.s+'</button></div>'}).join('')}
if(S==3)h='<h1>Confirm</h1><div class="esc"><div class="row"><span>Goods</span><b style="text-align:right">'+esc(D.item)+'</b></div><div class="row"><span>Route</span><b style="text-align:right">'+esc(D.from)+' → '+esc(D.to)+'</b></div>'+(D.pins.from?'<div class="row"><span>Pickup pin</span><b style="text-align:right">'+pinTxt('from')+'</b></div>':'')+(D.pins.to?'<div class="row"><span>Drop-off pin</span><b style="text-align:right">'+pinTxt('to')+'</b></div>':'')+'<div class="row"><span>Carrier fee (paid directly)</span><b style="text-align:right">KES '+D.c.f+'</b></div></div><p>Pilot limit: goods up to KES 5,000 per job. Beba is free during the pilot. You pay the carrier directly by M-Pesa and use the service at your own risk.</p><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="own" style="width:auto"> I accept the terms, and my goods are worth KES 5,000 or less</label><p id="msg" style="color:#b45309;font-weight:600"></p><button class="btn" onclick="acceptGo()">Pay carrier by M-Pesa</button>';
if(S==4)h='<h1>Hand over goods</h1><p>'+D.c.n+' is at your pickup point.</p><div>'+steps(1)+'</div>'+(D.byBiz?'<div class="esc"><b>SMS sent to '+esc(D.rcv.split(' · ')[0])+'</b><br>Hi '+esc(D.rcv.split(' · ')[0])+', your order from '+(esc(P.bn||'Mama Njeri Clothes'))+' is on its way to '+esc(D.to)+'. Track it here: <a href="#" onclick="setRole(\'c\');return false" style="color:var(--pri);font-weight:600">beba.link/x7k2</a> (example link, tap to open). No app needed.</div><p style="margin-top:10px">Open the Client link tab to see what your client sees.</p>':'')+'<p>Give this PIN to the carrier when you hand over the goods.</p><div class="pin">5 1 9 3</div><button class="btn" onclick="go(5)">'+(D.mode=='town'?'Carrier is on the way':'Carrier has loaded on matatu')+'</button>';
if(S==5)h='<h1>On its way</h1><div>'+steps(4)+'</div><h2>Proof</h2><div class="row"><div class="photo">Packed goods photo</div><div class="photo">'+(D.mode=='town'?'Photo at drop-off':'Parcel slip<br>KDA 123X · 0722 000 111')+'</div></div><div class="esc">Receiver ('+esc(D.rcv.split(' · ')[0])+') has been sent '+(D.mode=='town'?'a collection code.':'the plate number and a collection code.')+'</div><button class="btn" onclick="go(6)">Receiver collected the goods</button>';
if(S==6)h='<h1>Delivered ✓</h1><div>'+steps(5)+'</div><div class="esc">Delivery confirmed. Receipt and slip saved for both of you.</div><p style="font-size:24px;text-align:center;margin:14px">★ ★ ★ ★ ★</p><button class="btn alt" onclick="go(1)">New delivery</button>';if(S==7)h=sPinScreen()}
else{
if(S==1)h='<h1>New job</h1><p>Carrier view · '+D.c.n+'</p><div class="card"><b>'+esc(D.item)+'</b><p>'+esc(D.from)+' → '+esc(D.to)+'</p><p>Pickup: '+(pinTxt('from')||'not pinned yet')+'</p><p>Drop-off: '+(pinTxt('to')||'not pinned yet')+'</p><p>Fee KES '+D.c.f+'</p><span class="badge">Within your limit</span><span class="badge">Paid directly by sender</span></div><button class="btn" onclick="go(2)">Accept job</button>';
if(S==2)h='<h1>Pickup</h1><div>'+steps(1)+'</div><label>PIN from sender</label><input value="5193" style="text-align:center;font-size:22px;letter-spacing:8px"><div class="photo" style="margin-top:10px">Photo of packed goods</div><button class="btn" onclick="go(3)">Confirm pickup</button>';
if(S==3)h=D.mode=='town'?'<h1>Arrived at drop-off</h1><div>'+steps(3)+'</div><div class="photo" style="margin-top:10px">Photo of goods at drop-off</div><button class="btn" onclick="go(4)">Notify receiver</button>':'<h1>At the stage</h1><div>'+steps(3)+'</div><label>Matatu plate</label><input value="KDA 123X"><label>Conductor phone</label><input value="0722 000 111"><div class="photo" style="margin-top:10px">Photo of parcel slip</div><button class="btn" onclick="go(4)">Upload and notify receiver</button>';
if(S==4)h='<h1>Waiting for receiver</h1><div>'+steps(4)+'</div><p>Once the receiver confirms collection, the job is complete and rated.</p><button class="btn" onclick="go(5)">Receiver confirmed</button>';
if(S==5)h='<h1>Paid ✓</h1><div class="esc">Job complete. The sender paid you KES '+D.c.f+' directly. Rating 5 ★. Job count '+(D.c.j+1)+'.</div><button class="btn alt" onclick="go(1)">Back to jobs</button>'}
$('screen').innerHTML=h}
var LM=[{n:'Nairobi CBD',x:70,y:120},{n:'Gikomba',x:160,y:125},{n:'Kamukunji',x:190,y:95},{n:'Pangani',x:170,y:45},{n:'Eastleigh',x:255,y:60}];
function pinCard(){return '<label>Exact location</label><div class="card"><b>'+(P.pin?esc(P.pin.label):'Not set')+'</b><p>Clients and carriers find you by this pin.</p><button class="btn alt" onclick="sp();go(4)">'+(P.pin?'Change pin':'Pick exact location')+'</button></div>'}
function mapTap(e){var r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*320,y=(e.clientY-r.top)/r.height*220,b=LM[0],d=1e9;LM.forEach(function(m){var k=(m.x-x)*(m.x-x)+(m.y-y)*(m.y-y);if(k<d){d=k;b=m}});P.pin={src:'map',x:x,y:y,label:'near '+b.n};sp();render()}
function geoLoc(){sp();var m=function(t){$('gmsg').textContent=t};if(!navigator.geolocation){m('This browser cannot share location.');return}navigator.geolocation.getCurrentPosition(function(p){var a=p.coords.latitude,o=p.coords.longitude;P.pin={src:'gps',x:null,y:null,label:'from your phone location ('+a.toFixed(4)+', '+o.toFixed(4)+')'};render()},function(){m('Location is blocked here. It works on the live web address once you allow it.')})}
function pinScreen(){var q=P.pin,dots=LM.map(function(m){return '<circle cx="'+m.x+'" cy="'+m.y+'" r="3" fill="currentColor" fill-opacity=".5"/><text x="'+(m.x+6)+'" y="'+(m.y+4)+'" font-size="11" fill="currentColor">'+m.n+'</text>'}).join('');
var h='<h1>Pin your business</h1><p>Tap the exact spot of your stall or shop. No business name? The nearest known place is filled in for you.</p><svg viewBox="0 0 320 220" onclick="mapTap(event)" style="width:100%;color:var(--ink);border-radius:10px;cursor:crosshair;display:block"><rect width="320" height="220" rx="10" fill="currentColor" fill-opacity=".07"/><path d="M0 150 L320 110 M120 0 L150 220 M0 70 L320 90 M230 0 L260 220" stroke="currentColor" stroke-opacity=".2" stroke-width="6" fill="none"/>'+dots+(q&&q.x!=null?'<circle cx="'+q.x+'" cy="'+q.y+'" r="8" fill="var(--pri)" stroke="#fff" stroke-width="2"/>':'')+'</svg><p style="font-size:12px">Illustration, not to scale. The live app will use Google Maps.</p>'+(q?'<div class="esc"><b>Pinned '+esc(q.label)+'</b></div>':'<div class="esc">No pin yet. Tap the map.</div>')+pf('note','Describe it (landmark, gate, floor)')+'<button class="btn alt" onclick="geoLoc()">Use my current location</button><p id="gmsg" style="color:#b45309;font-weight:600"></p><button class="btn" onclick="sp();go(1)">Save location</button>';return h}
var O={code:'',sent:false,tries:0,msg:''};
function phNorm(x){var m=String(x).replace(/[\s-]/g,'').match(/^(?:\+?254|0)([17]\d{8})$/);return m?'254'+m[1]:''}
function phOk(){return !!P.pv&&P.pv===phNorm(P.ph)}
function vp(){sp();O.sent=false;O.msg='';go(5)}
function sendCode(){sp();if(!phNorm(P.ph)){O.sent=false;O.msg='Enter a valid Kenyan phone number, like 0712 345 678.';render();return}O.code=String(Math.floor(100000+Math.random()*900000));O.sent=true;O.tries=0;O.msg='';render()}
function checkCode(){var v=($('otp').value||'').replace(/\D/g,'');if(O.tries>=3)return;if(v===O.code){P.pv=phNorm(P.ph);O.sent=false;O.code='';O.msg='';go(2)}else{O.tries++;O.msg=O.tries>=3?'Too many wrong tries. Request a new code.':'That code is not right. '+(3-O.tries)+((3-O.tries)==1?' try':' tries')+' left.';render()}}
function submitP(){if(!phOk()){$('vmsg').textContent='Verify your phone number first.';return}go(3)}
function phRow(){return phOk()?vr('Phone number verified ('+esc(P.ph)+')'):'<div class="step"><div class="dot"></div>Phone number: code by SMS<button class="btn" style="margin-top:6px" onclick="vp()">Verify phone</button></div>'}
function phScreen(){var h='<h1>Verify your phone number</h1><p>We send a 6-digit code by SMS to confirm this number is yours.</p><div class="card"><b>'+esc(P.ph)+'</b><button class="btn alt" onclick="go(1)">Change number</button></div>';
if(!O.sent)h+=(O.msg?'<p style="color:#b45309;font-weight:600">'+O.msg+'</p>':'')+'<button class="btn" onclick="sendCode()">Send code</button>';
else h+='<div class="esc"><b>Demo only</b><br>In the live app this code arrives by SMS on '+esc(P.ph)+'. Your demo code: <b>'+O.code+'</b></div><label>Enter the 6-digit code</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="text-align:center;font-size:22px;letter-spacing:8px">'+(O.msg?'<p style="color:#b45309;font-weight:600">'+O.msg+'</p>':'')+(O.tries<3?'<button class="btn" onclick="checkCode()">Verify</button>':'')+'<button class="btn alt" onclick="sendCode()">Send a new code</button>';
return h+'<button class="btn alt" onclick="go(2)">Back</button>'}
var ST=[{n:'Imenti House',x:92,y:132},{n:'Thika stage (Accra Rd)',x:112,y:104},{n:'Nakuru stage',x:48,y:158},{n:'Naivasha stage',x:50,y:84},{n:'Hilton House',x:20,y:142},{n:'Bus station',x:150,y:172}];
function pinTxt(w){var q=D.pins[w];return q?esc(q.label)+(D.pn[w]?' · '+esc(D.pn[w]):''):''}
function sPinRow(w){var q=D.pins[w];return '<div class="card"><b>'+(q?pinTxt(w):'No pin yet')+'</b><button class="btn alt" onclick="'+(w=='from'?'sPinF()':'sPinT()')+'">'+(q?'Change pin':'Pin on map')+'</button></div>'}
function sPinF(){save();D.pw='from';S=7;render()}
function sPinT(){save();D.pw='to';S=7;render()}
function sNote(){var e=$('sn');if(e)D.pn[D.pw]=e.value}
function sTap(e){var r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*320,y=(e.clientY-r.top)/r.height*220,b=LM[0],d=1e9;LM.concat(ST).forEach(function(m){var k=(m.x-x)*(m.x-x)+(m.y-y)*(m.y-y);if(k<d){d=k;b=m}});sNote();D.pins[D.pw]={src:'map',x:x,y:y,label:'near '+b.n};render()}
function sGeo(){sNote();var m=function(t){$('smsg').textContent=t};if(!navigator.geolocation){m('This browser cannot share location.');return}navigator.geolocation.getCurrentPosition(function(p){D.pins[D.pw]={src:'gps',x:null,y:null,label:'from your phone location ('+p.coords.latitude.toFixed(4)+', '+p.coords.longitude.toFixed(4)+')'};render()},function(){m('Location is blocked here. It works on the live web address once you allow it.')})}
function sDone(){sNote();S=1;render()}
function sPinScreen(){var w=D.pw,dots=LM.map(function(m){return '<circle cx="'+m.x+'" cy="'+m.y+'" r="3" fill="currentColor" fill-opacity=".5"/><text x="'+(m.x+6)+'" y="'+(m.y+4)+'" font-size="11" fill="currentColor">'+m.n+'</text>'}).join('')+ST.map(function(m){return '<rect x="'+(m.x-3)+'" y="'+(m.y-3)+'" width="6" height="6" fill="currentColor" fill-opacity=".6"/><text x="'+(m.x+6)+'" y="'+(m.y+4)+'" font-size="10" fill="currentColor">'+m.n+'</text>'}).join('');
var pins=['from','to'].map(function(k){var q=D.pins[k];return q&&q.x!=null?'<circle cx="'+q.x+'" cy="'+q.y+'" r="9" fill="'+(k=='from'?'var(--pri)':'#b45309')+'" stroke="#fff" stroke-width="2"/><text x="'+q.x+'" y="'+(q.y+4)+'" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">'+(k=='from'?'A':'B')+'</text>':''}).join('');
var q=D.pins[w];
return '<h1>'+(w=='from'?'Pin the pickup point':(D.mode=='town'?'Pin the drop-off point':'Pin the drop-off stage'))+'</h1><p>Tap the exact spot on the map. The carrier uses this pin to find it.</p><svg viewBox="0 0 320 220" onclick="sTap(event)" style="width:100%;color:var(--ink);border-radius:10px;cursor:crosshair;display:block"><rect width="320" height="220" rx="10" fill="currentColor" fill-opacity=".07"/><path d="M0 150 L320 110 M120 0 L150 220 M0 70 L320 90 M230 0 L260 220" stroke="currentColor" stroke-opacity=".2" stroke-width="6" fill="none"/>'+dots+pins+'</svg><p style="font-size:12px">A is the pickup, B is the drop-off. Illustration, not to scale. The live app will use Google Maps.</p>'+(q?'<div class="esc"><b>Pinned '+esc(q.label)+'</b></div>':'<div class="esc">No pin yet. Tap the map.</div>')+'<label>Describe it (landmark, gate, floor)</label><input id="sn" value="'+esc(D.pn[w])+'"><button class="btn alt" onclick="sGeo()">Use my current location</button><p id="smsg" style="color:#b45309;font-weight:600"></p><button class="btn" onclick="sDone()">Save pin</button>'}
function sp(){['n','ph','town','bn','mk','gd','till','note'].forEach(function(k){var e=$('p_'+k);if(e)P[k]=e.value})}
function ck(k){sp();P[k]=!P[k];render()}
function pf(k,l){return '<label>'+l+'</label><input id="p_'+k+'" value="'+esc(P[k])+'">'}
function chk(k,t,d){return '<div class="card" style="cursor:pointer;display:flex;gap:10px;align-items:flex-start" onclick="ck(\''+k+'\')"><div class="dot" style="margin-top:2px;'+(P[k]?'background:var(--pri);border-color:var(--pri);color:var(--pri-ink)':'')+'">'+(P[k]?'✓':'')+'</div><div><b>'+t+'</b><p>'+d+'</p></div></div>'}
function vr(t,s){return '<div class="step done"><div class="dot">✓</div>'+t+'</div>'}
function client(){var n=esc(D.rcv.split(' · ')[0]),b=esc(P.bn||'Mama Njeri Clothes'),p=D.prog||0;
var h='<p style="text-align:center">What '+n+' sees on her phone. No app needed.</p><h1 style="margin-top:8px">Your order from '+b+'</h1><p>Going to '+esc(D.to)+'</p>';
if(p==0)h+='<div class="esc">Finding a trusted carrier. Start a request in the Sender tab and this page will update.</div>';
else{h+='<div style="margin-top:8px">'+steps(p)+'</div><div class="card"><b>'+D.c.n+'</b> <span class="ok">'+D.c.r+' ★</span><br><span class="badge">ID verified</span><span class="badge">'+D.c.j+' jobs</span><p>Carrying your goods.</p></div>';
if(p>=4)h+='<div class="card"><b>'+(D.mode=='town'?'Your carrier is at the drop-off':'Matatu KDA 123X')+'</b><p>'+(D.mode=='town'?'':'Conductor 0722 000 111. ')+'Collect at '+esc(D.to)+(D.pins.to?' ('+esc(D.pins.to.label)+')':'')+'.</p><p>Your collection code. Share it only when you hold the goods.</p><div class="pin">7 3 6 1</div></div>';
if(p>=5)h+='<div class="esc">Delivered. Thank you. Rate your carrier: ★ ★ ★ ★ ★</div>'}
h+='<button class="btn alt" onclick="setRole(\'b\')">Back to sender view</button>';return h}
function prof(){var h='';
if(S==1){h='<h1>Create your profile</h1><p>Anyone can join. Pick everything that applies.</p>'+pf('n','Full name')+pf('ph','Phone (M-Pesa)')+pf('town','Town')+'<h2>What do you do?</h2>'+chk('send','I’m looking for a delivery person','Get goods across town, to a stage or far town.')+chk('biz','I run a business','Get a business page. Clients without a delivery person can get a carrier from the app.')+chk('car','I carry goods','Earn fees and build a trust score.');
if(P.biz)h+='<h2>Business details</h2>'+pf('bn','Business name')+pf('mk','Market or area')+pinCard()+pf('gd','What you sell')+pf('till','M-Pesa till or paybill');
h+='<button class="btn" onclick="sp();go(2)">Continue</button>'}
if(S==2){h='<h1>Verify your profile</h1><p>Verified profiles get picked first.</p><div style="margin-top:10px">'+phRow()+vr('National ID photo')+vr('Selfie match')+(P.car?vr('Guarantor named (stage chairman, sacco official or market leader)')+vr('Invite-only pilot approval'):'')+(P.biz?vr('Shop or stall photo and location pin'):'')+'</div><p>The phone code is a demo. The other checks are marked done in this prototype. Real checks happen in the live app.</p><p id="vmsg" style="color:#b45309;font-weight:600"></p><button class="btn" onclick="submitP()">Submit</button><button class="btn alt" onclick="go(1)">Back</button>'}
if(S==3){h='<h1>'+esc(P.n)+'</h1><p>'+esc(P.town)+' · '+esc(P.ph)+'</p><div>'+(phOk()?'<span class="badge">Phone verified</span>':'')+'<span class="badge">ID verified</span>'+(P.send?'<span class="badge">Sender</span>':'')+(P.biz?'<span class="badge">Business</span>':'')+(P.car?'<span class="badge">Carrier</span>':'')+'</div>'+(P.car?'<div class="esc">Trust score: New. Delivery limit KES 5,000 until you complete 10 jobs.</div>':'');
if(P.biz)h+='<div class="card"><b>'+esc(P.bn||(P.pin?'Business '+P.pin.label:'Your business'))+'</b><p>'+esc(P.mk)+' · '+esc(P.gd)+'</p>'+(P.pin?'<p>Exact location: '+esc(P.pin.label)+(P.note?' · '+esc(P.note):'')+'</p>':'')+'<p>Public page: clients see you and can request a carrier for their order.</p><button class="btn" onclick="newReq(true)">Get a carrier for a client</button></div><div class="card"><b>My trusted carriers</b><p>Kevin M. · 4.9 ★ · favourite</p><p>Faith W. · 4.6 ★</p></div>';
if(P.car)h+='<div class="card"><b>Carrier status</b><p>Invite-only pilot. Jobs up to KES 5,000. The sender pays you directly.</p><button class="btn alt" onclick="setRole(\'r\')">See open jobs</button></div>';
if(P.send)h+='<button class="btn'+(P.biz?' alt':'')+'" onclick="newReq(false)">Find a delivery person</button>';
h+='<button class="btn alt" onclick="go(1)">Edit profile</button>'}
if(S==4)h=pinScreen();
if(S==5)h=phScreen();
return h}
render();
</script></body></html>

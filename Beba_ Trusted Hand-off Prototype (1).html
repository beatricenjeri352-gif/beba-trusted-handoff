<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beba: Trusted Hand-off Prototype</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2a22;--mut:#667068;--pri:#0f7a4a;--pri-ink:#fff;--line:#e2ddd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1c2520;--ink:#e9efe9;--mut:#9aa89e;--pri:#3ecf8e;--pri-ink:#07210f;--line:#2b372f;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:400px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{flex:1 1 auto;padding:10px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.phone{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;min-height:560px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:14px 0 6px}
p{color:var(--mut);font-size:13px;margin:4px 0}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--pri-ink);font-size:15px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:2px 4px 2px 0}
.ok{color:var(--pri);font-weight:600}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer}.seg button.on{border-color:var(--pri);color:var(--pri);font-weight:600}
.step{display:flex;gap:10px;padding:7px 0;font-size:14px;opacity:.45}.step.done,.step.now{opacity:1}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px}
.done .dot{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}.now .dot{border-color:var(--pri)}
.esc{background:var(--bg);border-radius:12px;padding:10px;font-size:13px;margin-top:10px}
.pin{font-size:34px;letter-spacing:10px;text-align:center;font-weight:700;margin:14px 0;color:var(--pri)}
.photo{height:64px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--mut);text-align:center;flex:1;padding:4px}
li{font-size:14px;margin:8px 0}
</style></head><body>
<div class="app">
<div class="tabs"><button id="tp" class="on" onclick="setRole('p')">Profile</button><button id="tb" onclick="setRole('b')">Sender</button><button id="tr" onclick="setRole('r')">Carrier</button><button id="tc" onclick="setRole('c')">Client link</button><button id="tt" onclick="setRole('t')">Trust</button></div>
<div class="phone" id="screen"></div>
</div>
<script>
var S=1,R='p',P={n:'Mama Njeri',ph:'0700 111 222',town:'Nairobi',send:true,biz:true,car:false,bn:'Mama Njeri Clothes',mk:'Gikomba',gd:'Second-hand clothes',till:''},D={prog:0,byBiz:true,mode:'stage',from:'Gikomba, Stall 14',item:'3 sacks of second-hand clothes (Esther’s order)',val:4000,to:'Thika stage, Accra Rd',rcv:'Esther · 0712 345 678'};
function $(i){return document.getElementById(i)}
function setRole(r){R=r;S=1;['p','b','r','c','t'].forEach(function(x){$('t'+x).className=x==r?'on':''});render()}
function go(n){S=n;if(R=='b')D.prog={1:0,2:0,3:0,4:1,5:4,6:5}[n];render()}
function save(){D.from=$('f').value;D.item=$('i').value;D.val=+$('v').value||0;D.to=$('t').value;D.rcv=$('c').value}
function mode(m){save();D.mode=m;D.to=m=='stage'?'Thika stage, Accra Rd':'Kitale town, Kitale stage';render()}
function steps(n){var l=['Carrier accepted'+(dep()?', deposit locked':''),'Picked up (PIN and photo)','At the stage','Loaded on matatu (parcel slip)','Receiver collected, code confirmed'];
return l.map(function(t,i){var c=i<n?'done':i==n?'now':'';return '<div class="step '+c+'"><div class="dot">'+(i<n?'✓':'')+'</div>'+t+'</div>'}).join('')}
function dep(){return D.val>10000?Math.round(D.val*0.2):0}
function ins(){return 0}
function reqNext(){save();if(D.val>5000){$('msg').textContent='Pilot limit: goods up to KES 5,000 per job.';return}go(2)}
function acceptGo(){if(!$('own').checked){$('msg').textContent='Please accept the terms to continue.';return}go(4)}
function render(){var h='';
if(R=='p'){h=prof()}
else if(R=='c'){h=client()}
else if(R=='t'){h='<h1>How trust is built in</h1><p>The carrier holds goods, so the carrier carries the risk.</p><ol style="padding-left:18px"><li><b>Verified carriers.</b> ID, selfie match, M-Pesa number, one referee.</li><li><b>Value tiers.</b> New carriers handle goods up to KES 5,000. Limits rise with completed, rated jobs.</li><li><b>Guarantor.</b> A stage chairman, sacco official or market leader vouches for each carrier.</li><li><b>Pilot cap.</b> Goods up to KES 5,000 per job while the app is in testing.</li><li><b>Direct payment.</b> The sender pays the carrier by M-Pesa. Beba holds no money.</li><li><b>Own-risk terms.</b> Senders accept that they use the service at their own risk. Beba is free during the pilot.</li><li><b>Pickup PIN and photo.</b> Proves the hand-over from sender to carrier.</li><li><b>Matatu proof.</b> Photo of the sacco parcel slip with plate number and conductor phone.</li><li><b>Receiver code.</b> The fee releases only when the receiver confirms.</li><li><b>Disputes.</b> 24-hour window. Photos, slip and GPS trail decide.</li></ol>'}
else if(R=='b'){
if(S==1)h='<h1>'+(D.byBiz?'Get a carrier for your client':'Send goods')+'</h1><p>'+(D.byBiz?'Your client gets an SMS tracking link. No app needed.':'Already bought? Get them to the stage or far town with someone you can trust.')+'</p><div class="seg"><button class="'+(D.mode=='stage'?'on':'')+'" onclick="mode(\'stage\')">To a matatu stage</button><button class="'+(D.mode=='far'?'on':'')+'" onclick="mode(\'far\')">To a far town</button></div><label>Pickup point</label><input id="f" value="'+D.from+'"><label>Goods</label><textarea id="i" rows="2">'+D.item+'</textarea><div class="row"><div><label>Declared value (KES)</label><input id="v" type="number" value="'+D.val+'"></div></div><label>'+(D.mode=='stage'?'Drop-off stage':'Destination')+'</label><input id="t" value="'+D.to+'"><label>'+(D.byBiz?'Client name and phone':'Receiver name and phone')+'</label><input id="c" value="'+D.rcv+'"><p id="msg" style="color:#b45309;font-weight:600"></p><button class="btn" onclick="reqNext()">Find trusted carriers</button>';
if(S==2){var far=D.mode=='far';h='<h1>'+(far?'Carriers near Kitale':'Carriers near Gikomba')+'</h1><p>'+(far?'Local agents and travellers heading that way.':'Ranked by trust score.')+'</p><div class="card"><b>'+(far?'Joseph K.':'Kevin M.')+'</b> <span class="ok">4.9 ★</span><br><span class="badge">ID verified</span><span class="badge">212 jobs</span><span class="badge">Zero losses</span><span class="badge">Limit KES 50,000</span><p>Fee KES '+(far?'1,200':'400')+' · paid directly to carrier</p><button class="btn" onclick="go(3)">Choose '+(far?'Joseph':'Kevin')+'</button></div><div class="card"><b>'+(far?'Mercy A.':'Faith W.')+'</b> <span class="ok">4.6 ★</span><br><span class="badge">ID verified</span><span class="badge">38 jobs</span><span class="badge">Limit KES 20,000</span><p>Fee KES '+(far?'900':'300')+'</p><button class="btn alt" onclick="go(3)">Choose '+(far?'Mercy':'Faith')+'</button></div>'}
if(S==3)h='<h1>Confirm</h1><div class="esc"><div class="row"><span>Goods</span><b style="text-align:right">'+D.item+'</b></div><div class="row"><span>Route</span><b style="text-align:right">'+D.from+' → '+D.to+'</b></div><div class="row"><span>Carrier fee (paid directly)</span><b style="text-align:right">KES '+(D.mode=='far'?'1,200':'400')+'</b></div></div><p>Pilot limit: goods up to KES 5,000 per job. Beba is free during the pilot. You pay the carrier directly by M-Pesa and use the service at your own risk.</p><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="own" style="width:auto"> I understand and accept the terms</label><p id="msg" style="color:#b45309;font-weight:600"></p><button class="btn" onclick="acceptGo()">Pay carrier by M-Pesa</button>';
if(S==4)h='<h1>Hand over goods</h1><p>Kevin M. is at your pickup point.</p><div>'+steps(1)+'</div>'+(D.byBiz?'<div class="esc"><b>SMS sent to '+D.rcv.split(' · ')[0]+'</b><br>Hi '+D.rcv.split(' · ')[0]+', your order from '+(P.bn||'Mama Njeri Clothes')+' is on its way to '+D.to+'. Track it here: <a href="#" onclick="setRole(\'c\');return false" style="color:var(--pri);font-weight:600">beba.link/x7k2</a> (example link, tap to open). No app needed.</div><p style="margin-top:10px">Open the Client link tab to see what your client sees.</p>':'')+'<p>Give this PIN to the carrier when you hand over the goods.</p><div class="pin">5 1 9 3</div><button class="btn" onclick="go(5)">Carrier has loaded on matatu</button>';
if(S==5)h='<h1>On its way</h1><div>'+steps(4)+'</div><h2>Proof</h2><div class="row"><div class="photo">Packed goods photo</div><div class="photo">Parcel slip<br>KDA 123X · 0722 000 111</div></div><div class="esc">Receiver ('+D.rcv.split(' · ')[0]+') has been sent the plate number and a collection code.</div><button class="btn" onclick="go(6)">Receiver collected the goods</button>';
if(S==6)h='<h1>Delivered ✓</h1><div>'+steps(5)+'</div><div class="esc">Delivery confirmed. Receipt and slip saved for both of you.</div><p style="font-size:24px;text-align:center;margin:14px">★ ★ ★ ★ ★</p><button class="btn alt" onclick="go(1)">New delivery</button>'}
else{
if(S==1)h='<h1>New job</h1><p>Carrier view · Kevin M.</p><div class="card"><b>'+D.item+'</b><p>'+D.from+' → '+D.to+'</p><p>Declared value KES '+D.val+' · Fee KES 400</p><span class="badge">Within your limit</span><span class="badge">Paid directly by sender</span></div><button class="btn" onclick="go(2)">Accept job</button>';
if(S==2)h='<h1>Pickup</h1><div>'+steps(1)+'</div><label>PIN from sender</label><input value="5193" style="text-align:center;font-size:22px;letter-spacing:8px"><div class="photo" style="margin-top:10px">Photo of packed goods</div><button class="btn" onclick="go(3)">Confirm pickup</button>';
if(S==3)h='<h1>At the stage</h1><div>'+steps(3)+'</div><label>Matatu plate</label><input value="KDA 123X"><label>Conductor phone</label><input value="0722 000 111"><div class="photo" style="margin-top:10px">Photo of parcel slip</div><button class="btn" onclick="go(4)">Upload and notify receiver</button>';
if(S==4)h='<h1>Waiting for receiver</h1><div>'+steps(4)+'</div><p>Once the receiver confirms collection, the job is complete and rated.</p><button class="btn" onclick="go(5)">Receiver confirmed</button>';
if(S==5)h='<h1>Paid ✓</h1><div class="esc">Job complete. The sender paid you KES 400 directly. Rating 5 ★. Job count 213.</div><button class="btn alt" onclick="go(1)">Back to jobs</button>'}
$('screen').innerHTML=h}
function sp(){['n','ph','town','bn','mk','gd','till'].forEach(function(k){var e=$('p_'+k);if(e)P[k]=e.value})}
function ck(k){sp();P[k]=!P[k];render()}
function pf(k,l){return '<label>'+l+'</label><input id="p_'+k+'" value="'+P[k]+'">'}
function chk(k,t,d){return '<div class="card" style="cursor:pointer;display:flex;gap:10px;align-items:flex-start" onclick="ck(\''+k+'\')"><div class="dot" style="margin-top:2px;'+(P[k]?'background:var(--pri);border-color:var(--pri);color:var(--pri-ink)':'')+'">'+(P[k]?'✓':'')+'</div><div><b>'+t+'</b><p>'+d+'</p></div></div>'}
function vr(t,s){return '<div class="step done"><div class="dot">✓</div>'+t+'</div>'}
function client(){var n=D.rcv.split(' · ')[0],b=P.bn||'Mama Njeri Clothes',p=D.prog||0;
var h='<p style="text-align:center">What '+n+' sees on her phone. No app needed.</p><h1 style="margin-top:8px">Your order from '+b+'</h1><p>Going to '+D.to+'</p>';
if(p==0)h+='<div class="esc">Finding a trusted carrier. Start a request in the Sender tab and this page will update.</div>';
else{h+='<div style="margin-top:8px">'+steps(p)+'</div><div class="card"><b>Kevin M.</b> <span class="ok">4.9 ★</span><br><span class="badge">ID verified</span><span class="badge">212 jobs</span><p>Carrying your goods. Declared value KES '+D.val+'.</p></div>';
if(p>=4)h+='<div class="card"><b>Matatu KDA 123X</b><p>Conductor 0722 000 111. Collect at '+D.to+'.</p><p>Your collection code. Share it only when you hold the goods.</p><div class="pin">7 3 6 1</div></div>';
if(p>=5)h+='<div class="esc">Delivered. Thank you. Rate your carrier: ★ ★ ★ ★ ★</div>'}
h+='<button class="btn alt" onclick="setRole(\'b\')">Back to sender view</button>';return h}
function prof(){var h='';
if(S==1){h='<h1>Create your profile</h1><p>Anyone can join. Pick everything that applies.</p>'+pf('n','Full name')+pf('ph','Phone (M-Pesa)')+pf('town','Town')+'<h2>What do you do?</h2>'+chk('send','I send goods','Get goods to a stage or far town.')+chk('biz','I run a business','Get a business page. Clients without a delivery person can get a carrier from the app.')+chk('car','I carry goods','Earn fees and build a trust score.');
if(P.biz)h+='<h2>Business details</h2>'+pf('bn','Business name')+pf('mk','Market or location')+pf('gd','What you sell')+pf('till','M-Pesa till or paybill');
h+='<button class="btn" onclick="sp();go(2)">Continue</button>'}
if(S==2){h='<h1>Verify your profile</h1><p>Verified profiles get picked first.</p><div style="margin-top:10px">'+vr('Phone number (OTP)')+vr('National ID photo')+vr('Selfie match')+(P.car?vr('Guarantor named (stage chairman, sacco official or market leader)')+vr('Invite-only pilot approval'):'')+(P.biz?vr('Shop or stall photo and location pin'):'')+'</div><p>Real checks happen in the live app. This prototype marks them done.</p><button class="btn" onclick="go(3)">Submit</button><button class="btn alt" onclick="go(1)">Back</button>'}
if(S==3){h='<h1>'+P.n+'</h1><p>'+P.town+' · '+P.ph+'</p><div><span class="badge">ID verified</span>'+(P.send?'<span class="badge">Sender</span>':'')+(P.biz?'<span class="badge">Business</span>':'')+(P.car?'<span class="badge">Carrier</span>':'')+'</div><div class="esc">Trust score: New. Delivery limit KES 5,000 until you complete 10 jobs.</div>';
if(P.biz)h+='<div class="card"><b>'+(P.bn||'Your business')+'</b><p>'+P.mk+' · '+P.gd+'</p><p>Public page: clients see you and can request a carrier for their order.</p><button class="btn" onclick="D.byBiz=true;setRole(\'b\')">Get a carrier for a client</button></div><div class="card"><b>My trusted carriers</b><p>Kevin M. · 4.9 ★ · favourite</p><p>Faith W. · 4.6 ★</p></div>';
if(P.car)h+='<div class="card"><b>Carrier status</b><p>Invite-only pilot. Jobs up to KES 5,000. The sender pays you directly.</p><button class="btn alt" onclick="setRole(\'r\')">See open jobs</button></div>';
if(P.send&&!P.biz)h+='<button class="btn" onclick="setRole(\'b\')">Send goods</button>';
h+='<button class="btn alt" onclick="go(1)">Edit profile</button>'}
return h}
render();
</script></body></html>
